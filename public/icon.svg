<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Thruster Flame Gradient -->
    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Hull Metallic Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cockpit Canopy Gradient -->
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Cargo Box Gradient -->
    <linearGradient id="cargoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern in Background -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" 
        stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Background Stars -->
  <circle cx="80" cy="90" r="2.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="420" cy="110" r="2" fill="#f43f5e" opacity="0.8" />
  <circle cx="110" cy="410" r="2" fill="#a855f7" opacity="0.7" />
  <circle cx="430" cy="390" r="3" fill="#22d3ee" opacity="0.9" />
  <circle cx="200" cy="70" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="340" cy="440" r="1.5" fill="#ffffff" opacity="0.7" />

  <!-- Orbital Slipstream Rings -->
  <ellipse cx="256" cy="270" rx="190" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="6" 
           transform="rotate(-25 256 270)" filter="url(#neonGlow)" />
  <ellipse cx="256" cy="270" rx="190" ry="60" fill="none" stroke="#22d3ee" stroke-width="2" 
           transform="rotate(-25 256 270)" opacity="0.9" />

  <!-- Rocket Thruster Exhaust Plume -->
  <path d="M 236 330 C 236 380, 246 440, 256 460 C 266 440, 276 380, 276 330 Z" 
        fill="url(#thrusterGrad)" filter="url(#neonGlow)" />
  <path d="M 244 330 C 244 370, 250 410, 256 430 C 262 410, 268 370, 268 330 Z" 
        fill="#ffffff" opacity="0.9" />

  <!-- Side Booster Jets -->
  <path d="M 188 310 C 188 340, 192 370, 198 385 C 204 370, 208 340, 208 310 Z" 
        fill="url(#thrusterGrad)" opacity="0.8" />
  <path d="M 304 310 C 304 340, 308 370, 314 385 C 320 370, 324 340, 324 310 Z" 
        fill="url(#thrusterGrad)" opacity="0.8" />

  <!-- Space Courier Shuttle Body -->
  <!-- Left Wing & Booster -->
  <path d="M 256 120 L 190 280 L 170 320 L 220 310 L 244 320 Z" 
        fill="url(#hullGrad)" stroke="#38bdf8" stroke-width="3" />
  <!-- Right Wing & Booster -->
  <path d="M 256 120 L 322 280 L 342 320 L 292 310 L 268 320 Z" 
        fill="url(#hullGrad)" stroke="#38bdf8" stroke-width="3" />

  <!-- Central Fuselage -->
  <path d="M 256 90 L 220 270 L 224 325 L 288 325 L 292 270 Z" 
        fill="#0f172a" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)" />
  <path d="M 256 90 L 220 270 L 224 325 L 288 325 L 292 270 Z" 
        fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Cargo Pod Container (Glowing Magenta/Purple) -->
  <rect x="238" y="235" width="36" height="45" rx="6" 
        fill="url(#cargoGrad)" stroke="#f43f5e" stroke-width="2.5" filter="url(#neonGlow)" />
  <line x1="238" y1="257" x2="274" y2="257" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  <line x1="256" y1="235" x2="256" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

  <!-- Cockpit Visor / Canopy -->
  <path d="M 256 125 L 238 185 C 238 205, 274 205, 274 185 Z" 
        fill="url(#canopyGrad)" stroke="#67e8f9" stroke-width="2.5" />
  <ellipse cx="250" cy="155" rx="4" ry="12" fill="#ffffff" opacity="0.6" transform="rotate(-15 250 155)" />

  <!-- High-Tech Neon Wingtip Beacons -->
  <circle cx="170" cy="320" r="4.5" fill="#f43f5e" filter="url(#neonGlow)" />
  <circle cx="342" cy="320" r="4.5" fill="#22d3ee" filter="url(#neonGlow)" />

  <!-- Sleek Nose Cone Light -->
  <circle cx="256" cy="94" r="3.5" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Front Foreground Ring Accent (Gives 3D depth) -->
  <path d="M 120 310 C 180 345, 320 345, 395 295" fill="none" stroke="#22d3ee" stroke-width="5" 
        stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)" />
</svg>
